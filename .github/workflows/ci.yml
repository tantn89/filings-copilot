name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      # Unit + integration tests run fully offline: fake Claude client, hashing embedder,
      # mocked EDGAR transport and an in-memory DuckDB.
      - run: pytest --cov=filings_copilot --cov-report=term-missing
