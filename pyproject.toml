[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "filings-copilot"
version = "0.1.0"
description = "Agentic research assistant over SEC 10-K filings: hybrid retrieval on filing text + guarded text-to-SQL on XBRL financials, with citations and evals."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tan Tran" }]
dependencies = [
  "anthropic>=1.0",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "fastembed>=0.4",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "selectolax>=0.3.21",
  "sqlglot>=25.0",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Agent evals and the CI eval gate run on regressgate; the serving image does not need it.
eval = ["regressgate>=0.1,<0.2"]
dev = [
  "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.6",
  "regressgate>=0.1,<0.2",
]

[project.scripts]
filings-copilot = "filings_copilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
